[profile.default]
src = 'contracts'
out = 'out'
evm_version = "prague"
optimizer = true
optimizer_runs = 200
libs = []
remappings = []
ignored_warnings_from = ["contracts/external/"]
ignored_error_codes = ["too-many-warnings"]

[fmt]
line_length = 100
tab_width = 2
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "preserve"
single_line_statement_blocks = "preserve"
multiline_func_header = "attributes_first"
ignore = ["contracts/external/**"]

[lint]
exclude_lints = [
    "asm-keccak256",
    "mixed-case-function",
    "mixed-case-variable",
    "named-struct-fields",
    "unwrapped-modifier-logic",
]
