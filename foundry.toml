[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = '0.8.34'
optimizer = true
optimizer_runs = 200
evm_version = 'cancun'
remappings = []

[fuzz]
runs = 1000

[invariant]
runs = 1
depth = 100

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"

[etherscan]
mainnet = { key = "${MAINNET_API_KEY}" }

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
