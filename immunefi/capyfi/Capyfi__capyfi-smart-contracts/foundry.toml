[profile.default]
solc_version = "0.8.10"
src = "src"
out = "out"
libs = ["lib"]
ignored_warnings_from = ["src/contracts"]
optimizer = true
optimizer_runs = 200

[invariant]
runs = 256
depth = 64
fail_on_revert = true


[rpc_endpoints]
lachain = "${LACHAIN_RPC_URL}"
latestnet = "${LATESTNET_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options